# Copy to config.yaml and fill in. Keep config.yaml out of git!

# bot token from @BotFather
telegram_token: "1234567890:your-bot-token-here"

# CUPS printer name (see: lpstat -p)
printer: MyPrinter

# only these Telegram user ids may print/scan; scans go back
# to whoever asked. Find your id by messaging the bot once and
# reading the daemon log, or by asking @userinfobot.
allowed_users:
  - 12345678

# admins may use the bot and approve new users: when an unknown
# user writes, every admin gets an Erlauben/Ablehnen button.
# Approved users are saved to the state file (see below).
admins:
  - 12345678

# where approved users and per-chat settings are stored
# state_file: state.yaml

# SANE device name (optional; see: scanimage -L).
# Network scanners that speak eSCL/AirScan work driverless
# via sane-backends' escl backend, addressed by URL:
# scanner: "escl:http://192.168.1.2:80"
# scanner: "pixma:04A9176D_XXXX"
